# General settings
name: 'fb_hierarchies'      # Warning: 'debug' and 'test' are reserved name that have a special behavior

wandb: 'online'             # online | offline | disabled
gpus: 1                     # Multi-gpu is not implemented on this branch

root_path: E:\HiGGs-main1\HiGGs-main\data # Should be absolute path to data directory

h1_model: E:\HiGGs-main1\HiGGs-main\saved_models\facebook\facebook_h1.ckpt # Use absolute paths
glue_model: E:\HiGGs-main1\HiGGs-main\saved_models\facebook\facebook_glue.ckpt # Use absolute paths
h2_model: E:\HiGGs-main1\HiGGs-main\saved_models\facebook\facebook_h2.ckpt # Use absolute paths
h2_model_family: digress  # set beta_h2 only when h2_model is a ConditionalGraphBetaDiffusionH2 checkpoint





samples_to_generate: 1
h1_batch_size: 8
glue_batch_size: 2
