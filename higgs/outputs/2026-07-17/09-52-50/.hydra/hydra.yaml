hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - general=sample_sbm
    - general.h2_model=E:\HiGGs-GBD\HiGGs-main\outputs\2026-07-17\09-50-49\checkpoints\beta_h2_smoke_train\last.ckpt
    - general.h2_model_family=beta_h2
    - general.h1_model=E:\HiGGs-main1\HiGGs-main\saved_models\sbm\sbm_h1.ckpt
    - general.glue_model=E:\HiGGs-main1\HiGGs-main\saved_models\sbm\sbm_glue.ckpt
    - general.root_path=E:\HiGGs-main1\HiGGs-main\data
    - general.samples_to_generate=1
    - general.h1_batch_size=8
    - general.glue_batch_size=8
    - general.visualize=false
    - general.intermediate_figures=false
    - general.wandb=disabled
    - general.gpus=1
  job:
    name: sample_main
    chdir: null
    override_dirname: general.glue_batch_size=8,general.glue_model=E:\HiGGs-main1\HiGGs-main\saved_models\sbm\sbm_glue.ckpt,general.gpus=1,general.h1_batch_size=8,general.h1_model=E:\HiGGs-main1\HiGGs-main\saved_models\sbm\sbm_h1.ckpt,general.h2_model=E:\HiGGs-GBD\HiGGs-main\outputs\2026-07-17\09-50-49\checkpoints\beta_h2_smoke_train\last.ckpt,general.h2_model_family=beta_h2,general.intermediate_figures=false,general.root_path=E:\HiGGs-main1\HiGGs-main\data,general.samples_to_generate=1,general.visualize=false,general.wandb=disabled,general=sample_sbm
    id: ???
    num: ???
    config_name: sample
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: E:\HiGGs-GBD\HiGGs-main\higgs
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: E:\HiGGs-GBD\HiGGs-main\configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: E:\HiGGs-GBD\HiGGs-main\higgs\outputs\2026-07-17\09-52-50
    choices:
      dataset: fb_hierarchies
      train: train_default
      model: discrete_small
      general: sample_sbm
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
